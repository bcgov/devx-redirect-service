name: Build, test and publish the image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  
  build-test-publish:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: write
    env:
      MAX_ATTEMPTS: 5
      SLEEP_DURATION: 30
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 #v4.1.0
      

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 #v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=true
          tags: |
            type=sha,format=short   
            type=raw,value=${{ github.ref_name }}
      
      - name: Build and export to Docker
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf #v7.2.0
        with:
          context: .
          load: true
          tags: ${{ github.ref_name}}
      
      - name: Run container
        run: |
          docker run --rm -d -p 2015:2015 -p 2016:2016 -p 2017:2017 -p 2018:2018 -p 2019:2019 --name redirect-container ${{ github.ref_name }}
      
      - name: Wait for healthy container
        run: |
          for ((i=1; i<=${{ env.MAX_ATTEMPTS }}; i++)); do
            health=$(docker inspect --format='{{.State.Health.Status}}' redirect-container)
            if [[ "$health" = "healthy" ]]; then
              echo "Container is healthy!"; exit 0
            fi
            echo "Waiting for container to become healthy... ($i/${{ env.MAX_ATTEMPTS }})"
            sleep ${{ env.SLEEP_DURATION }}
          done
          echo "Container did not become healthy in time." && docker logs redirect-container && exit 1
      
      - name: Setup Python environment
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 #v6.2.0
        with:
          python-version: '3.x'

      - name: Run tests
        run: |
          cd ./scripts
          python3 -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          python test-redirects.py
      
      - name: Stop container
        if: always()
        run: docker stop redirect-container


      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee #v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor}}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      
      - name: Build and push to GitHub Container Registry
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf #v7.2.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e #v4.36.2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
