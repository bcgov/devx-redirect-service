test_services:
  - service: docs
    port: 2015
    test_404: true
    cases:
      - path: /
        expected: "https://developer.gov.bc.ca/docs/default/component/platform-developer-docs/"
      - path: /sysdig-monitor-onboarding/
        expected: "https://developer.gov.bc.ca/docs/default/component/platform-developer-docs/docs/app-monitoring/sysdig-monitor-onboarding/"
      - path: /rocketchat-etiquette/
        expected: "https://developer.gov.bc.ca/docs/default/component/bc-developer-guide/rocketchat/rocketchat-etiquette/"
      - path: /platform-security-tools/
        expected: "https://developer.gov.bc.ca/docs/default/component/platform-developer-docs/docs/security-and-privacy-compliance/platform-security-tools/"

  - service: stackoverflow
    port: 2017
    test_404: true
    cases:
      - path: /
        expected: "https://github.com/bcgov/bcgov-community-discussions/discussions"
      - path: /questions
        expected: "https://github.com/bcgov/bcgov-community-discussions/discussions"
      - path: /questions/94/117
        expected: "https://github.com/bcgov/bcgov-community-discussions/discussions/16#discussioncomment-14942167"
      - path: /q/100
        expected: "https://github.com/bcgov/bcgov-community-discussions/discussions/18"
      - path: /a/121
        expected: "https://github.com/bcgov/bcgov-community-discussions/discussions/21#discussioncomment-14942197"

  - service: rocketchat
    port: 2018
    test_404: false
    cases:
      - path: /
        expected: "https://bcgov.sharepoint.com/teams/developercommunity"
      - path: /some/path?test=1
        expected: "https://bcgov.sharepoint.com/teams/developercommunity"

  - service: just-ask
    port: 2019
    test_404: false
    cases:
      - path: /
        expected: "https://developer.gov.bc.ca/docs/default/component/bc-developer-guide/use-github-in-bcgov/bc-government-organizations-in-github/#single-sign-on"
      - path: /some/other/path?foo=bar
        expected: "https://developer.gov.bc.ca/docs/default/component/bc-developer-guide/use-github-in-bcgov/bc-government-organizations-in-github/#single-sign-on"
